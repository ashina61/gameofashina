<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Ancient City</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Ancient City - antik cag sehir kurma ve yonetme stratejisi." />
    <meta name="theme-color" content="#1b1710" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        /*
         * Sistem cubuklarinin kapladigi kenar paylari.
         * Bunlar ozel ozellige alinir ki hem CSS'ten okunabilsinler hem de
         * test sirasinda cihaz taklidi icin gecersiz kilinabilsinler.
         */
        --safe-area-top: env(safe-area-inset-top, 0px);
        --safe-area-right: env(safe-area-inset-right, 0px);
        --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-left: env(safe-area-inset-left, 0px);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #12100b;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        /* Mobil tarayicilarda dokunmatik kaydirma/zoom jestlerini oyuna birak */
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #game-root {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-root canvas {
        display: block;
        touch-action: none;
      }
      /*
       * Kenar paylarini JavaScript'e tasiyan olcum ogesi.
       * env() degerleri dogrudan okunamadigi icin padding'e yazilip
       * getComputedStyle ile piksel olarak geri okunur. Gorunmez ve
       * dokunusa kapalidir.
       */
      #safe-area-probe {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        visibility: hidden;
        pointer-events: none;
        padding-top: var(--safe-area-top);
        padding-right: var(--safe-area-right);
        padding-bottom: var(--safe-area-bottom);
        padding-left: var(--safe-area-left);
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #12100b;
        color: #d9c9a3;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 13px;
        transition: opacity 0.35s ease;
        z-index: 10;
      }
      #boot-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .mark {
        font-size: 22px;
        letter-spacing: 0.3em;
        color: #e8c86a;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <div id="safe-area-probe" aria-hidden="true"></div>
    <div id="boot-splash">
      <div class="mark">ANCIENT CITY</div>
      <div>yukleniyor</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
