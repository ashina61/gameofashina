name: Regenerate Building Art Pass 6

on:
  push:
    branches:
      - chatgpt/building-art-pass-6
    paths:
      - 'payitaht/tools/art/buildings.py'
      - 'payitaht/tools/art/isokit.py'
      - '.github/workflows/building-art-pass-6.yml'
  pull_request:
    branches:
      - claude/ancient-city-phaser-game-r9e0qu
    paths:
      - 'payitaht/tools/art/buildings.py'
      - 'payitaht/tools/art/isokit.py'
      - '.github/workflows/building-art-pass-6.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: payitaht
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/building-art-pass-6
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install art dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Compile generator
        run: python -m py_compile tools/art/buildings.py tools/art/isokit.py
      - name: Render remaining redesigned buildings
        run: |
          python tools/art/buildings.py \
            ambar depo ticaret_merkezi kara_pazar \
            marangoz mimar camci simyahane gozlukcu bagci mahzen ormanci tasci \
            tophane barutane siginak korsan_kalesi \
            saray valilik elcilik muze harita_arsivi \
            cami tekke mabet kahvehane karagoz liman
      - name: Commit generated WebP assets
        run: |
          git config user.name "payitaht-art-bot"
          git config user.email "actions@github.com"
          git add public/images/game/buildings/*.webp lib/game/city-map/building-flags.json
          if git diff --cached --quiet; then
            echo "Generated assets already up to date."
            exit 0
          fi
          git commit -m "Regenerate remaining architecture families"
          git push origin HEAD:chatgpt/building-art-pass-6
