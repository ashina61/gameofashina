# Payitaht Adaları oyununu GitHub Pages'e yayinlar (repo'daki TEK oyun).
#
# NEDEN VAR: oyun linki kalici bir adrese bagli. main'e her giren degisiklik
# otomatik yayina cikar. Oyun payitaht/ alt dizininde gelistirilir ama Pages
# KOKUNDE (ashina61.github.io/gameofashina/) yayinlanir.
#
# KAPI ONCE, YAYIN SONRA: tip kontrolu ve testler gecmeden derleme yapilmaz.
name: Deploy

on:
  push:
    branches: [main, claude/ancient-city-phaser-game-r9e0qu]
  # Elle tetiklenebilir: yayini kod degismeden yenilemek gerekirse.
  workflow_dispatch:

# Pages yayini icin gereken en dar izin kumesi.
permissions:
  contents: read
  pages: write
  id-token: write

# Ayni anda tek yayin; yarim kalmis bir yayin birakmamak icin iptal EDILMEZ.
concurrency:
  group: pages
  cancel-in-progress: false

# Oyun payitaht/ alt dizininde; adimlar orada calisir.
defaults:
  run:
    working-directory: payitaht

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: pnpm kur
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Bağımlılıklar
        run: pnpm install --frozen-lockfile

      # Kapilar: biri bile kirmiziysa yayin yapilmaz.
      - name: Tip kontrolü
        run: pnpm exec tsc --noEmit
      - name: Testler
        run: pnpm exec tsx --test $(find lib -name '*.test.ts')

      # Statik disa aktarim, Pages KOKUNDE (/gameofashina) yayinlanacak sekilde.
      - name: Derle (statik export)
        env:
          STATIC_EXPORT: '1'
          NEXT_BASE_PATH: /gameofashina
          NEXT_PUBLIC_ASSET_BASE: /gameofashina
        run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          # upload-pages-artifact yolu repo kokune goredir (working-directory
          # yalnizca 'run' adimlarina uygulanir).
          path: payitaht/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
