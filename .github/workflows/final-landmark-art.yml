name: Regenerate Final Landmark Art

on:
  push:
    branches:
      - chatgpt/visual-final-pass
    paths:
      - 'payitaht/tools/art/buildings.py'
      - '.github/workflows/final-landmark-art.yml'
  pull_request:
    branches:
      - claude/ancient-city-phaser-game-r9e0qu
    paths:
      - 'payitaht/tools/art/buildings.py'
      - '.github/workflows/final-landmark-art.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: payitaht
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/visual-final-pass
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install art dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Compile generator
        run: python -m py_compile tools/art/buildings.py tools/art/isokit.py
      - name: Render final landmark assets
        run: python tools/art/buildings.py divan surlar
      - name: Validate six rendered assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('public/images/game/buildings')
          expected = [root / f'{bid}-{stage}.webp' for bid in ('divan','surlar') for stage in (1,2,3)]
          for p in expected:
              if not p.exists():
                  raise SystemExit(f'missing asset: {p}')
              im = Image.open(p).convert('RGBA')
              if im.width != 600:
                  raise SystemExit(f'bad width {p}: {im.size}')
              alpha = im.getchannel('A')
              lo, hi = alpha.getextrema()
              if hi == 0:
                  raise SystemExit(f'empty transparent asset: {p}')
              if lo == 255:
                  raise SystemExit(f'asset lost transparent background: {p}')
              print(p, im.size, alpha.getbbox())
          PY
      - name: Commit generated landmark WebP assets
        run: |
          git config user.name "payitaht-art-bot"
          git config user.email "actions@github.com"
          git add \
            public/images/game/buildings/divan-*.webp \
            public/images/game/buildings/surlar-*.webp \
            lib/game/city-map/building-flags.json
          if git diff --cached --quiet; then
            echo "Generated assets already up to date."
            exit 0
          fi
          git commit -m "Regenerate Divanhane and Surlar art"
          git pull --rebase origin chatgpt/visual-final-pass
          git push origin HEAD:chatgpt/visual-final-pass
