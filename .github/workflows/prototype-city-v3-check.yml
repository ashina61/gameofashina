name: Prototype City V3 Check

on:
  push:
    branches: [prototype/city-v3-rok]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: payitaht

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Tests
        run: pnpm exec tsx --test $(find lib -name '*.test.ts')
      - name: Build prototype branch
        env:
          STATIC_EXPORT: '1'
          NEXT_BASE_PATH: /gameofashina
          NEXT_PUBLIC_ASSET_BASE: /gameofashina
        run: pnpm build
