name: H3 ImageGen finalize

on:
  push:
    branches: [codex/gorsel]
    paths:
      - '.github/workflows/h3-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gorsel
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build H3 from ImageGen source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cd payitaht
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageFilter, ImageDraw
          import json, shutil

          root = Path('.')
          src_path = root / 'h3-imagegen-source.webp'
          out_path = root / 'public/images/game/terrain/city-base-test.webp'
          review = root / 'visual-review/H3'
          centers_path = review / 'city-base-centers.json'
          review.mkdir(parents=True, exist_ok=True)

          src = Image.open(src_path).convert('RGB')
          assert src.size == (768, 710), src.size
          base = src.resize((2336, 2160), Image.Resampling.LANCZOS)
          base = base.filter(ImageFilter.UnsharpMask(radius=1.1, percent=45, threshold=3))
          out_path.parent.mkdir(parents=True, exist_ok=True)
          for q in (82, 78, 74, 70, 66, 62, 58):
              base.save(out_path, 'WEBP', quality=q, method=6)
              if out_path.stat().st_size <= 1_200_000:
                  quality = q
                  break
          else:
              raise SystemExit('H3 asset budget exceeded')

          shutil.copy2(out_path, review / 'city-base-test.webp')

          phone = Image.new('RGB', (390, 844), (17, 48, 57))
          thumb = ImageOps.contain(base, (390, 740), Image.Resampling.LANCZOS)
          phone.paste(thumb, ((390-thumb.width)//2, (844-thumb.height)//2))
          phone.save(review / 'after-390x844.webp', 'WEBP', quality=80, method=6)

          template_path = root / 'docs/mockups/sehir-taban-sablon.png'
          if template_path.exists():
              template = Image.open(template_path).convert('RGB').resize(base.size, Image.Resampling.LANCZOS)
              Image.blend(base, template, .33).save(review / 'template-overlay.webp', 'WEBP', quality=76, method=6)

          centers = json.loads(centers_path.read_text())
          overlay = base.copy()
          draw = ImageDraw.Draw(overlay)
          for p in centers['plots']:
              x, y = p['center_px']
              r = 12 if p['kind'] == 'center' else 9
              draw.ellipse((x-r,y-r,x+r,y+r), fill=(190,35,28), outline=(255,240,190), width=3)
          overlay.save(review / 'plot-centers-overlay.webp', 'WEBP', quality=78, method=6)

          preview = base.convert('RGBA')
          target_ids = ['visual_center','visual_land_11','visual_land_12','visual_land_15','visual_land_16']
          bids = ['divan','konut','kereste','ambar','kisla']
          by_id = {p['id']: p for p in centers['plots']}
          for bid, vid in zip(bids, target_ids):
              cand = sorted((root/'public/images/game/buildings').glob(f'{bid}-painted-1*.webp'))
              if not cand: continue
              art = Image.open(cand[0]).convert('RGBA')
              f = min(330/art.width, 330/art.height)
              art = art.resize((max(1,round(art.width*f)), max(1,round(art.height*f))), Image.Resampling.LANCZOS)
              cx, cy = by_id[vid]['center_px']
              preview.alpha_composite(art, (round(cx-art.width/2), round(cy-art.height*.78)))
          preview.convert('RGB').save(review / 'building-preview.webp', 'WEBP', quality=78, method=6)

          checks = {
              'generator': 'OpenAI ImageGen + light crop/cleanup; one-piece painted base',
              'width': 2336,
              'height': 2160,
              'bytes': out_path.stat().st_size,
              'quality': quality,
              'visual_centers_json': 'visual-review/H3/city-base-centers.json',
              'visual_plot_count': centers['counts']['total'],
              'slot_coordinates_changed': False,
              'connected_to_game': False,
              'phase_stop': 'H3'
          }
          (review/'checks.json').write_text(json.dumps(checks, ensure_ascii=False, indent=2)+'\n')
          (review/'README.md').write_text(
              '# H3 — ImageGen tek-parça şehir tabanı denemesi\n\n'
              'H3 yeniden üretildi: tek parça ImageGen boyaması, 24 boş kara arsası + merkez alan + 3 kıyı platformu. '
              'ImageGen geometrisi gerçek şablona zorlanmadı; görseldeki 28 merkezin piksel koordinatları `city-base-centers.json` içindedir. '
              'Bu koordinatlar oyun slotu değildir ve `lib/game/city-map/*` değiştirilmemiştir.\n\n'
              '`template-overlay.webp` yalnız hizalama teşhisidir. `plot-centers-overlay.webp` JSON merkezlerini gösterir. '
              '`building-preview.webp` beş mevcut boyalı bina ile Photoshop-tarzı değerlendirme önizlemesidir. '
              'Görsel Phaser/oyuna bağlanmadı; H3 burada durur.\n'
          )

          credits = root/'public/images/game/CREDITS.md'
          text = credits.read_text()
          old = 'H3 gerçek city-slots.json geometrisi ve onaylı zemin/dekorlarla üretildi.'
          new = 'H3 OpenAI ImageGen ile tek parça boyandı; şablona zorlanmadığı için görsel arsa merkezleri visual-review/H3/city-base-centers.json içinde ayrıca kaydedildi.'
          if old in text:
              text = text.replace(old, new)
          marker = '### H3 ImageGen yeniden boyama — 2026-10-04'
          if marker not in text:
              text += '\n\n' + marker + '\n\n`terrain/city-base-test.webp`: OpenAI ImageGen tabanlı tek-parça H3 denemesi; hafif kırpma/temizlik ve WebP kodlama uygulandı. Görsel oyun slotlarına bağlı değildir. Arsa merkezleri `visual-review/H3/city-base-centers.json` içindedir. Üçüncü taraf oyun görseli kullanılmadı.\n'
          credits.write_text(text)
          PY
          test $(stat -c%s public/images/game/terrain/city-base-test.webp) -le 1200000
          cd ..
      - name: Remove temporary generators and commit H3
        run: |
          git rm -f --ignore-unmatch .github/workflows/h123-assets.yml
          git rm -f --ignore-unmatch payitaht/tools/art/h123_generate.py
          git rm -f --ignore-unmatch .github/workflows/h3-finalize.yml
          git rm -f --ignore-unmatch payitaht/h3-imagegen-source.webp
          git add -A payitaht/public/images/game/terrain/city-base-test.webp payitaht/visual-review/H3 payitaht/public/images/game/CREDITS.md
          ! git diff --cached --name-only | grep -E 'lib/game/city-map/|building-page\.tsx|battle-view\.tsx|research-|ikariam-panels\.tsx'
          git commit -m 'H3: repaint single-piece ImageGen city base and remove temp generators'
          git push origin HEAD:codex/gorsel
