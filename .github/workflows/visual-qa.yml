# Mobile visual QA. Captures the REAL rendered game at phone size and checks
# the layout rules of V2 Faz 0 (overflow, clipped text, 44px touch targets,
# 11px text, overlaps). Suites run in parallel; each builds the static export.
name: Mobile Visual QA

on:
  push:
    branches:
      - claude/ancient-city-phaser-game-r9e0qu
      - 'chatgpt/painted-*'
    paths:
      - 'payitaht/app/**'
      - 'payitaht/components/**'
      - 'payitaht/hooks/**'
      - 'payitaht/lib/**'
      - 'payitaht/public/images/game/**'
      - 'payitaht/tools/*.cjs'
      - 'payitaht/tools/lib/**'
      - 'payitaht/tools/fixtures/**'
      - '.github/workflows/visual-qa.yml'
  pull_request:
    branches:
      - claude/ancient-city-phaser-game-r9e0qu
    paths:
      - 'payitaht/app/**'
      - 'payitaht/components/**'
      - 'payitaht/hooks/**'
      - 'payitaht/lib/**'
      - 'payitaht/public/images/game/**'
      - 'payitaht/tools/*.cjs'
      - 'payitaht/tools/lib/**'
      - 'payitaht/tools/fixtures/**'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-visual-qa-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: payitaht

jobs:
  qa:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    # Yazılımla (GPU'suz) çizilen Phaser ekranı yavaş; her takım ayrı işte
    # koşar, en uzunu ~10 dk. Sınır pay bırakır.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [layout, heraldry, first-ten, city-390, city-412, city-430]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Install game dependencies
        run: pnpm install --frozen-lockfile
      - name: Export same site as GitHub Pages
        env:
          STATIC_EXPORT: '1'
          NEXT_BASE_PATH: /gameofashina
          NEXT_PUBLIC_ASSET_BASE: /gameofashina
        run: pnpm build
      - name: Install isolated browser for visual QA
        # apt aynası zaman zaman takılıyor (0.30.0'da bir iş 12 dk asılı kaldı):
        # her deneme 5 dk ile sınırlı, üç deneme.
        timeout-minutes: 16
        run: |
          npm install --no-audit --no-fund --prefix "${RUNNER_TEMP}/visual" playwright@1.55.0
          for i in 1 2 3; do
            timeout 300 "${RUNNER_TEMP}/visual/node_modules/.bin/playwright" install --with-deps chromium && exit 0
            echo "::warning::Tarayıcı kurulumu $i. denemede bitmedi, yeniden deneniyor"; sleep 10
          done
          exit 1
      - name: Serve static export under real Pages base path
        run: |
          mkdir -p "${RUNNER_TEMP}/visual-site/gameofashina"
          cp -a out/. "${RUNNER_TEMP}/visual-site/gameofashina/"
          python3 -m http.server 4173 --directory "${RUNNER_TEMP}/visual-site" >"${RUNNER_TEMP}/visual-site.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/gameofashina/ -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/gameofashina/ -o /dev/null
      - name: Run ${{ matrix.suite }}
        env:
          NODE_PATH: ${{ runner.temp }}/visual/node_modules
          SUITE: ${{ matrix.suite }}
        run: |
          case "$SUITE" in
            layout)   node --check tools/layout-qa.cjs && node tools/layout-qa.cjs ;;
            heraldry) node --check tools/heraldry-qa.cjs && node tools/heraldry-qa.cjs ;;
            first-ten) node --check tools/first-ten-qa.cjs && node tools/first-ten-qa.cjs ;;
            city-390) node tools/visual-qa-current-flow.cjs && VISUAL_QA_VIEWPORTS=390x844 node tools/visual-qa.cjs ;;
            city-412) VISUAL_QA_VIEWPORTS=412x915 node tools/visual-qa.cjs ;;
            city-430) VISUAL_QA_VIEWPORTS=430x932 node tools/visual-qa.cjs ;;
            *) echo "unknown suite $SUITE"; exit 1 ;;
          esac
      # Faz 0.5: önceki yeşil koşunun aynı takımıyla piksel karşılaştırması.
      # Yalnız uyarı üretir; tasarım değişikliği bilinçliyse yok sayılır.
      - name: Fetch previous green screenshots
        if: success() && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SUITE: ${{ matrix.suite }}
        run: |
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow visual-qa.yml --branch "$GITHUB_REF_NAME" --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$prev" ]; then gh run download "$prev" --repo "$GITHUB_REPOSITORY" -n "payitaht-visual-$SUITE" -D "${RUNNER_TEMP}/prev" || true; fi
      - name: Compare with previous screenshots
        if: success() && github.event_name == 'push'
        continue-on-error: true
        env:
          NODE_PATH: ${{ runner.temp }}/visual/node_modules
        run: node tools/visual-diff.cjs "${RUNNER_TEMP}/prev" visual-review
      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payitaht-visual-${{ matrix.suite }}
          path: payitaht/visual-review/
          retention-days: 14
          if-no-files-found: warn