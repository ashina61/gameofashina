name: Regenerate Coast Art

on:
  push:
    branches:
      - chatgpt/coast-art-redesign
    paths:
      - 'payitaht/tools/art/buildings.py'
      - '.github/workflows/coast-art-redesign.yml'
  pull_request:
    branches:
      - claude/ancient-city-phaser-game-r9e0qu
    paths:
      - 'payitaht/tools/art/buildings.py'
      - '.github/workflows/coast-art-redesign.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: payitaht
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/coast-art-redesign
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install art dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow
      - name: Compile generator
        run: python -m py_compile tools/art/buildings.py tools/art/isokit.py
      - name: Guard against baked water
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('tools/art/buildings.py').read_text()
          a = src.index('def tersane(s, st):')
          b = src.index('\ndef karagoz(s, st):', a)
          c = src.index('def _p6_harbour(s, st):')
          d = src.index('\n\n# --- Pass 6 override girişleri', c)
          for name, block in [('tersane', src[a:b]), ('liman', src[c:d])]:
              if 'water_basin(' in block:
                  raise SystemExit(f'{name} still bakes water into the building asset')
          print('No baked water in Liman/Tersane generators.')
          PY
      - name: Render coast assets
        run: python tools/art/buildings.py liman tersane
      - name: Validate coast transparency
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path('public/images/game/buildings')
          for bid in ('liman','tersane'):
              for stage in (1,2,3):
                  p = root / f'{bid}-{stage}.webp'
                  im = Image.open(p).convert('RGBA')
                  alpha = im.getchannel('A')
                  if im.width != 600:
                      raise SystemExit(f'bad width: {p} {im.size}')
                  if alpha.getextrema()[0] == 255:
                      raise SystemExit(f'{p} lost transparent sea area')
                  opaque = sum(1 for v in alpha.getdata() if v > 24)
                  ratio = opaque / (im.width * im.height)
                  print(p, im.size, 'occupied=', round(ratio, 3), 'bbox=', alpha.getbbox())
                  if ratio > 0.72:
                      raise SystemExit(f'{p} is too opaque for a coast-edge asset: {ratio:.3f}')
          PY
      - name: Commit generated coast WebP assets
        run: |
          git config user.name "payitaht-art-bot"
          git config user.email "actions@github.com"
          git add \
            public/images/game/buildings/liman-*.webp \
            public/images/game/buildings/tersane-*.webp \
            lib/game/city-map/building-flags.json
          if git diff --cached --quiet; then
            echo "Generated assets already up to date."
            exit 0
          fi
          git commit -m "Regenerate Liman and Tersane coast assets"
          git pull --rebase origin chatgpt/coast-art-redesign
          git push origin HEAD:chatgpt/coast-art-redesign
