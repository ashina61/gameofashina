name: Approved City Art References
on:
  push:
    branches: [recovery/approved-city-source-105]
permissions:
  contents: write
defaults:
  run:
    working-directory: payitaht
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Prepare exact reference quadrants
        run: node tools/art/approved-reference-crops.cjs
      - name: Preserve reference images on the work branch
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payitaht/tools/art/approved-sources/reference-*.png
          git diff --cached --quiet || git commit -m "Preserve exact approved terrain reference quadrants"
          git push origin HEAD:recovery/approved-city-source-105
