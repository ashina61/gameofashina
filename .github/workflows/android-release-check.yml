name: Android Release Check

on:
  pull_request:
    branches:
      - claude/ancient-city-phaser-game-r9e0qu
    paths:
      - 'payitaht/**'
      - '.github/workflows/android-release-check.yml'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

concurrency:
  group: android-release-check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: payitaht

jobs:
  release-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types, regressions and CSS
        run: pnpm check
      - name: Check V2 budgets
        run: node tools/v2-criteria.cjs
      - name: Build native static export
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_NATIVE: '1'
        run: pnpm build:android
      - name: Install Android UI test browser
        run: |
          npm install --no-audit --no-fund --prefix "${RUNNER_TEMP}/android-qa" playwright@1.55.0
          "${RUNNER_TEMP}/android-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check compiled Android UI at phone sizes
        env:
          NODE_PATH: ${{ runner.temp }}/android-qa/node_modules
          ANDROID_QA_URL: http://127.0.0.1:4180/
          LAYOUT_QA_URL: http://127.0.0.1:4180/
        run: |
          python3 -m http.server 4180 --bind 127.0.0.1 --directory out >"${RUNNER_TEMP}/android-qa-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4180/ -o /dev/null; then break; fi
            sleep 1
          done
          node tools/android-qa.cjs
          node tools/layout-qa.cjs
      - name: Upload Android UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-evidence
          path: |
            payitaht/visual-review/android/
            payitaht/visual-review/layout-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Sync Capacitor
        run: pnpm exec cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Build unsigned production bundle with R8
        working-directory: payitaht/android
        env:
          PAYITAHT_VERSION_CODE: '999999'
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace
      - name: Verify release bundle exists
        run: test -s android/app/build/outputs/bundle/release/app-release.aab
      - name: Build installable device-test APK
        working-directory: payitaht/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload device-test APK
        uses: actions/upload-artifact@v4
        with:
          name: payitaht-device-test-apk
          path: payitaht/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: payitaht-unsigned-aab
          path: payitaht/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  android-device:
    needs: release-check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: payitaht-device-test-apk
          path: ${{ runner.temp }}/payitaht-apk
      - name: Install WebView test client
        run: npm install --no-audit --no-fund --prefix "${RUNNER_TEMP}/android-device" playwright@1.55.0
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test the compiled APK on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          NODE_PATH: ${{ runner.temp }}/android-device/node_modules
          ANDROID_DEVICE_EVIDENCE: ${{ github.workspace }}/payitaht/visual-review/android-device
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          emulator-options: -no-window -no-snapshot -gpu swangle -feature -Vulkan -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: node payitaht/tools/android-device-qa.cjs "$RUNNER_TEMP/payitaht-apk/app-debug.apk"
      - name: Capture emulator host diagnostics
        if: always()
        run: |
          mkdir -p visual-review/android-device
          sudo dmesg -T > visual-review/android-device/host-kernel.txt
          free -h > visual-review/android-device/host-memory.txt
          ps aux --sort=-rss | head -30 > visual-review/android-device/host-processes.txt
      - name: Verify the Android end-to-end report
        run: |
          node -e "const r = require('./visual-review/android-device/report.json'); require('node:assert/strict').equal(r.passed, true)"
      - name: Upload Android device test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-evidence
          path: payitaht/visual-review/android-device/
          if-no-files-found: ignore
          retention-days: 14
