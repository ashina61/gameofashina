<!doctype html>
<html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Payitaht · Tek bina denemesi</title>
<style>*{box-sizing:border-box}body{margin:0;background:#211c14;color:#f0dfbb;font:16px system-ui;height:100dvh;display:flex;flex-direction:column}header{padding:12px 16px;background:#332619;border-bottom:1px solid #9a7945}h1{font-size:18px;margin:0 0 4px}p{font-size:13px;margin:0;color:#d0bd98}main{position:relative;flex:1;min-height:0;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:10px;background:#332619}button{min-width:44px;min-height:44px;border:1px solid #a1804d;border-radius:8px;background:#493523;color:#f9e7c0;font:inherit;padding:8px 12px}button[aria-pressed=true]{background:#8a6735;color:white}#status{position:absolute;top:10px;left:10px;max-width:calc(100% - 20px);background:#211c14df;padding:7px 10px;border-radius:6px;font-size:12px;pointer-events:none}</style>
<header><h1>Kışla · Tek arsa denemesi</h1><p>Mevcut şehir zemini üzerinde ortak açı ve düz avlu.</p></header>
<main><canvas aria-label="Mevcut şehir üzerinde tek kışla yerleşimi"></canvas><div id="status">Yükleniyor…</div></main>
<nav aria-label="Görünüm"><button id="before" aria-pressed="true">Boş arsa</button><button id="after" aria-pressed="false">Kışla</button><button id="outline" aria-pressed="true">Karo sınırı</button><button id="home">Arsaya dön</button><button id="all">Şehrin tamamı</button><button id="minus" aria-label="Uzaklaştır">−</button><button id="plus" aria-label="Yakınlaştır">+</button></nav>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');
// Coordinates measured on the visible bare soil, excluding planted border and kerb.
const polygon=[[868,314],[1016,314],[1026,385],[859,385]];
// One uniform transform fits the entire artwork, including tower tops, to that soil.
const artwork={x:812.6,y:289.8,width:260,height:132};
const view={x:943,y:349,scale:1},images=[],state={building:false,outline:true,ready:false};
function path(points){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath()}
function render(){if(!state.ready)return;const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#30291d';ctx.fillRect(0,0,r.width,r.height);ctx.translate(r.width/2,r.height/2);ctx.scale(view.scale,view.scale);ctx.translate(-view.x,-view.y);images.slice(0,4).forEach((im,i)=>ctx.drawImage(im,(i%2)*768,Math.floor(i/2)*512,768,512));if(state.building){ctx.save();path(polygon);ctx.clip();ctx.drawImage(images[4],artwork.x,artwork.y,artwork.width,artwork.height);ctx.restore()}if(state.outline){path(polygon);ctx.strokeStyle='#f9d868';ctx.lineWidth=2/view.scale;ctx.stroke()}status.textContent=(state.building?'Kışla yerleşimi':'Boş toprağın gerçek sınırı')+' · '+Math.round(view.scale*100)+'%';window.__buildingFit={ready:true,polygon,artwork,view:{...view},building:state.building,outline:state.outline,buildings:state.building?1:0}}
function focus(){view.x=943;view.y=349;view.scale=Math.min(canvas.clientWidth/330,canvas.clientHeight/230);render()}
function pressed(){document.querySelector('#before').setAttribute('aria-pressed',String(!state.building));document.querySelector('#after').setAttribute('aria-pressed',String(state.building));document.querySelector('#outline').setAttribute('aria-pressed',String(state.outline));render()}
document.querySelector('#before').onclick=()=>{state.building=false;pressed()};document.querySelector('#after').onclick=()=>{state.building=true;pressed()};document.querySelector('#outline').onclick=()=>{state.outline=!state.outline;pressed()};document.querySelector('#home').onclick=focus;document.querySelector('#all').onclick=()=>{view.x=768;view.y=512;view.scale=Math.min(canvas.clientWidth/1536,canvas.clientHeight/1024);render()};function zoom(f){view.scale=Math.max(.15,Math.min(5,view.scale*f));render()}document.querySelector('#plus').onclick=()=>zoom(1.25);document.querySelector('#minus').onclick=()=>zoom(.8);canvas.onwheel=e=>{e.preventDefault();zoom(e.deltaY<0?1.1:1/1.1)};const pointers=new Map();let pinchDistance=0;canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);pinchDistance=0};canvas.onpointermove=e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){view.x-=(e.clientX-old[0])/view.scale;view.y-=(e.clientY-old[1])/view.scale;render()}else{const [a,b]=[...pointers.values()],distance=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinchDistance)zoom(distance/pinchDistance);pinchDistance=distance}};canvas.onpointerup=canvas.onpointercancel=e=>{pointers.delete(e.pointerId);pinchDistance=0};window.addEventListener('resize',render);
Promise.all(['nw','ne','sw','se'].map(id=>'images/game/terrain/unified-detail-v3/'+id+'.webp').concat('images/game/building-fit/v1/kisla-on-ground.webp').map(src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error(src));im.src=src}))).then(result=>{images.push(...result);state.ready=true;focus()}).catch(e=>{status.textContent='Görsel yüklenemedi. Sayfayı yenileyin.';console.error(e)});
</script></html>
